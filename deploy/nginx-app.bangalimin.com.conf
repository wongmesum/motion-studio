server {
    server_name app.bangalimin.com;

    # Matches the express.json limit so oversized job payloads are rejected at the
    # edge instead of being buffered and then refused by the app.
    client_max_body_size 12m;

    # Builder uploads are streamed to disk, so only this exact prefix may exceed 12 MB.
    # The cap is 110m: the largest allowed upload (100 MiB video) plus multipart overhead.
    location = /api/studio/assets {
        client_max_body_size 110m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Renders stream responses (SSE) and can stay busy for minutes.
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    access_log /var/log/nginx/app.bangalimin.com.access.log;
    error_log  /var/log/nginx/app.bangalimin.com.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.bangalimin.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.bangalimin.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.bangalimin.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name app.bangalimin.com;
    return 404; # managed by Certbot
}
