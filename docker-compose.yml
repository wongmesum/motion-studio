services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  vps-server:
    build:
      context: .
      dockerfile: vps-server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file: .env
    volumes:
      - ./vps-server/data:/app/vps-server/data:z
      - ./output:/app/output:z
      - ./cache:/app/cache:z
      - ./frames:/app/frames:z
    depends_on:
      redis:
        condition: service_healthy
    shm_size: '2gb'

  worker:
    build:
      context: .
      dockerfile: vps-server/Dockerfile
    restart: unless-stopped
    command: node vps-server/workers/worker.js
    env_file: .env
    volumes:
      - ./vps-server/data:/app/vps-server/data:z
      - ./output:/app/output:z
      - ./cache:/app/cache:z
      - ./frames:/app/frames:z
    depends_on:
      redis:
        condition: service_healthy
    shm_size: '2gb'

volumes:
  redis-data:
