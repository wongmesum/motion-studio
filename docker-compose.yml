version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: motion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: motion-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data

  vps-server:
    build: ./vps-server
    container_name: motion-vps-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    volumes:
      - ./render-engine:/app/render-engine
      - ./vps-server/data:/app/data
      - ./output:/app/output
      - ./cache:/app/cache
      - ./frames:/app/frames
    depends_on:
      - redis
      - minio
    shm_size: '2gb'

  worker:
    build: ./vps-server
    restart: unless-stopped
    command: node workers/worker.js
    env_file: .env
    volumes:
      - ./render-engine:/app/render-engine
      - ./vps-server/data:/app/data
      - ./output:/app/output
      - ./cache:/app/cache
      - ./frames:/app/frames
    depends_on:
      - redis
      - minio
    shm_size: '2gb'
    deploy:
      replicas: 2

volumes:
  redis-data:
  minio-data:
