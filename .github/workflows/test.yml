name: Node tests
on:
  pull_request:
  push:
    branches: [main, feature/ai-motion-editor]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save busboy
      - run: npx playwright install --with-deps chromium
      - run: npm test
