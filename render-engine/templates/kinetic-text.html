<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Motion Studio — Kinetic Text & Neon City Glitch (AI 2025/2026)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #05050d;
    font-family: 'Inter', 'Arial Black', system-ui, sans-serif;
  }
  canvas {
    position: absolute;
    inset: 0;
    display: block;
  }
  .hud-frame {
    position: absolute;
    inset: 48px;
    border: 1px solid rgba(0, 255, 255, 0.22);
    pointer-events: none;
  }
  .hud-corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border-color: #00f0ff;
    border-style: solid;
  }
  .tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
  .tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; }
  .bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; }
  .br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }
  .center-stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .kicker {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 12px;
    color: #00f0ff;
    text-transform: uppercase;
    margin-bottom: 16px;
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
  }
  .glitch-wrap {
    position: relative;
  }
  .title-main {
    font-size: 180px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 6px;
    line-height: 1;
    text-shadow: 0 0 40px rgba(0, 255, 255, 0.65), 0 0 90px rgba(255, 0, 255, 0.45);
  }
  .title-layer {
    position: absolute;
    top: 0;
    left: 0;
    font-size: 180px;
    font-weight: 900;
    letter-spacing: 6px;
    line-height: 1;
    pointer-events: none;
    opacity: 0;
  }
  .layer-cyan { color: #00f0ff; mix-blend-mode: screen; }
  .layer-magenta { color: #ff00a0; mix-blend-mode: screen; }
  .sub-bar {
    margin-top: 34px;
    padding: 12px 36px;
    background: linear-gradient(90deg, rgba(255,0,160,0.25), rgba(0,240,255,0.25));
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #e2e8f0;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 3px;
  }
  .timecode {
    position: absolute;
    bottom: 24px;
    right: 32px;
    font-family: monospace;
    font-size: 22px;
    color: rgba(0, 240, 255, 0.8);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<canvas id="cityCanvas" width="1920" height="1080"></canvas>
<div class="hud-frame">
  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>
  <div class="timecode" id="timecode">TC 00:00:00:00</div>
</div>
<div class="center-stage">
  <div class="kicker" id="kicker">HIGGSFIELD × DEEPSEEK × PLAYWRIGHT</div>
  <div class="glitch-wrap" id="glitchWrap">
    <div class="title-main" id="titleMain">AI 2025</div>
    <div class="title-layer layer-cyan" id="titleCyan">AI 2025</div>
    <div class="title-layer layer-magenta" id="titleMagenta">AI 2025</div>
  </div>
  <div class="sub-bar" id="subBar">FUTURISTIC NEON MOTION PIPELINE</div>
</div>

<script>
const canvas = document.getElementById('cityCanvas');
const ctx = canvas.getContext('2d');
const W = 1920, H = 1080;

// ---- Motion Studio project data. Legacy renders keep hardcoded text. ----
const PROJECT = (function () {
  const node = document.getElementById('motion-project-data');
  if (!node) return null;
  try { return JSON.parse(node.textContent); } catch (error) { return null; }
})();
function projectScenes() {
  return PROJECT && Array.isArray(PROJECT.scenes) ? PROJECT.scenes : [];
}
function sceneElement(scene, role) {
  if (!scene || !Array.isArray(scene.elements)) return null;
  return scene.elements.find(function (element) {
    return element.type === 'text' && element.role === role;
  }) || null;
}

// The scene timeline owns the video length. Offsets are cumulative `durationSec` values;
// nothing here reads a wall clock, so every frame is a pure function of `time`.
const TIMELINE = (function () {
  const scenes = projectScenes();
  if (!scenes.length) return null;
  let offset = 0;
  return scenes.map(function (scene) {
    const durationSec = Number(scene.durationSec) > 0 ? Number(scene.durationSec) : 4;
    const entry = { scene: scene, start: offset, durationSec: durationSec };
    offset += durationSec;
    return entry;
  });
})();
const TOTAL_DURATION = TIMELINE
  ? TIMELINE.reduce(function (total, entry) { return total + entry.durationSec; }, 0)
  : 10;

function entryAt(time) {
  if (!TIMELINE) return null;
  const clamped = Math.max(0, Math.min(TOTAL_DURATION - 0.0001, time));
  for (let i = 0; i < TIMELINE.length; i++) {
    const entry = TIMELINE[i];
    // The last scene owns the final instant instead of falling through to undefined.
    if (clamped < entry.start + entry.durationSec || i === TIMELINE.length - 1) {
      return {
        scene: entry.scene,
        index: i,
        localT: Math.max(0, clamped - entry.start),
        durationSec: entry.durationSec,
      };
    }
  }
  return null;
}

function transitionState(scene, localT) {
  const transition = scene.transition || {};
  const type = transition.type || 'fade';
  const windowSec = Math.min(
    Number(transition.durationSec) > 0 ? Number(transition.durationSec) : 0.5,
    (Number(scene.durationSec) > 0 ? Number(scene.durationSec) : 4) / 2
  );
  const p = windowSec > 0 ? Math.min(1, localT / windowSec) : 1;
  if (type === 'none') return { alpha: 1, x: 0 };
  if (type === 'slide') return { alpha: p, x: (1 - p) * 180 };
  return { alpha: p, x: 0 };
}

// Every advertised text property lands here, so the inspector never writes a value the
// template silently drops.
function setTextProps(node, element) {
  if (!element) return;
  if (Number.isFinite(element.fontSize)) node.style.fontSize = element.fontSize + 'px';
  if (typeof element.color === 'string' && element.color) node.style.color = element.color;
  if (typeof element.align === 'string') node.style.textAlign = element.align;
}

function syncSceneText(scene) {
  const caption = sceneElement(scene, 'caption');
  const title = sceneElement(scene, 'title');
  const subtitle = sceneElement(scene, 'subtitle');

  const kicker = document.getElementById('kicker');
  kicker.textContent = caption && typeof caption.text === 'string'
    ? caption.text
    : 'HIGGSFIELD × DEEPSEEK × PLAYWRIGHT';
  setTextProps(kicker, caption);

  const titleText = title && typeof title.text === 'string' ? title.text : 'AI 2025';
  const main = document.getElementById('titleMain');
  const cyan = document.getElementById('titleCyan');
  const magenta = document.getElementById('titleMagenta');
  main.textContent = titleText;
  cyan.textContent = titleText;
  magenta.textContent = titleText;
  // The glitch layers clone the title but keep their neon blend colors, so only geometry
  // and alignment follow the element; the palette follows the main title.
  setTextProps(main, title);
  if (Number.isFinite(title && title.fontSize)) {
    cyan.style.fontSize = title.fontSize + 'px';
    magenta.style.fontSize = title.fontSize + 'px';
  }
  if (title && typeof title.align === 'string') {
    cyan.style.textAlign = title.align;
    magenta.style.textAlign = title.align;
  }
  if (title && typeof title.color === 'string' && title.color) {
    main.style.textShadow = 'none';
  }

  const subBar = document.getElementById('subBar');
  subBar.textContent = subtitle && typeof subtitle.text === 'string'
    ? subtitle.text
    : 'FUTURISTIC NEON MOTION PIPELINE';
  setTextProps(subBar, subtitle);
}
syncSceneText(projectScenes()[0]);

window.__ASSETS_READY__ = Promise.resolve();
window.__AWAIT_FRAME__ = function () { return null; };

// Pseudo-random deterministik berbasis seed
function seededRandom(seed) {
  const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// Gedung kota futuristik pre-generated secara deterministik
const buildings = Array.from({ length: 42 }, (_, i) => ({
  x: i * 48 - 20,
  w: 36 + Math.floor(seededRandom(i + 1) * 34),
  h: 220 + Math.floor(seededRandom(i + 10) * 420),
  hue: seededRandom(i + 20) > 0.5 ? 188 : 312,
}));

function drawFuturisticCity(t) {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#04040c');
  sky.addColorStop(0.55, '#120829');
  sky.addColorStop(1, '#240b36');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Cyber sun / moon
  const sunY = H * 0.46;
  const sunGrad = ctx.createRadialGradient(W / 2, sunY, 10, W / 2, sunY, 340);
  sunGrad.addColorStop(0, 'rgba(255, 0, 160, 0.55)');
  sunGrad.addColorStop(0.5, 'rgba(0, 240, 255, 0.2)');
  sunGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = sunGrad;
  ctx.fillRect(0, 0, W, H);

  // Silhouette gedung + jendela neon
  const horizonY = H * 0.78;
  buildings.forEach((b, idx) => {
    const parallaxX = ((b.x - t * 18 * (idx % 2 === 0 ? 0.6 : 1)) % (W + 100) + (W + 100)) % (W + 100) - 50;
    const topY = horizonY - b.h;
    ctx.fillStyle = '#070714';
    ctx.fillRect(parallaxX, topY, b.w, b.h + 250);

    ctx.strokeStyle = `hsla(${b.hue}, 100%, 60%, 0.35)`;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(parallaxX, topY, b.w, b.h);
  });

  // Perspective neon grid di bawah horizon
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, horizonY, W, H - horizonY);
  ctx.clip();

  ctx.fillStyle = '#060410';
  ctx.fillRect(0, horizonY, W, H - horizonY);

  ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
  ctx.lineWidth = 2;
  for (let i = -20; i <= 20; i++) {
    ctx.beginPath();
    ctx.moveTo(W / 2 + i * 35, horizonY);
    ctx.lineTo(W / 2 + i * 220, H);
    ctx.stroke();
  }

  const speedOffset = (t * 2.5) % 1;
  for (let row = 0; row < 12; row++) {
    const p = Math.pow((row + speedOffset) / 12, 2.1);
    const y = horizonY + p * (H - horizonY);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();

  // Scanlines halus
  ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
  for (let y = 0; y < H; y += 4) {
    ctx.fillRect(0, y, W, 1);
  }
}

function updateDOM(t, state) {
  const mainEl = document.getElementById('titleMain');
  const cyanEl = document.getElementById('titleCyan');
  const magEl = document.getElementById('titleMagenta');
  const wrapEl = document.getElementById('glitchWrap');
  const kickerEl = document.getElementById('kicker');
  const subBarEl = document.getElementById('subBar');
  const tcEl = document.getElementById('timecode');
  const stageEl = document.querySelector('.center-stage');

  // Scene entry transition (fade / slide / none) moves the whole stage.
  stageEl.style.opacity = String(state.alpha);
  stageEl.style.transform = 'translateX(' + state.x + 'px)';

  // Fade in & scale pop
  const fade = Math.min(1, t / 0.8);
  const scale = 1 + Math.sin(t * 3) * 0.035;
  wrapEl.style.opacity = String(fade);
  wrapEl.style.transform = `scale(${scale.toFixed(4)})`;

  kickerEl.style.opacity = String(Math.min(1, Math.max(0, (t - 0.2) / 0.6)));
  subBarEl.style.opacity = String(Math.min(1, Math.max(0, (t - 0.5) / 0.7)));
  kickerEl.style.transform = 'none';
  subBarEl.style.transform = 'none';

  // Efek Glitch Deterministik aktif setelah t > 1.0s pada interval tertentu
  const glitchTrigger = t > 1.0 && (Math.sin(t * 17) > 0.62 || Math.cos(t * 29) > 0.78);
  if (glitchTrigger) {
    const shiftX = (seededRandom(Math.floor(t * 60)) - 0.5) * 28;
    const topClip = Math.floor(seededRandom(Math.floor(t * 60) + 1) * 60);
    const botClip = Math.floor(seededRandom(Math.floor(t * 60) + 2) * 35);

    cyanEl.style.opacity = '0.85';
    magEl.style.opacity = '0.85';
    cyanEl.style.transform = `translate(${shiftX}px, -4px)`;
    magEl.style.transform = `translate(${-shiftX}px, 4px)`;
    cyanEl.style.clipPath = `inset(${topClip}% 0 ${botClip}% 0)`;
    magEl.style.clipPath = `inset(${botClip}% 0 ${topClip}% 0)`;
  } else {
    cyanEl.style.opacity = '0';
    magEl.style.opacity = '0';
    mainEl.style.transform = 'translate(0, 0)';
  }

  // Update timecode
  const sec = Math.floor(t);
  const frame = Math.floor((t % 1) * 60);
  tcEl.textContent = `TC 00:00:${String(sec).padStart(2, '0')}:${String(frame).padStart(2, '0')}`;
}

// Layer authored motion on top of the existing neon entrance/glitch animation.
// Scene-local seconds ensure seeking to arbitrary frames is deterministic.
function applyKineticMotion(scene, localT) {
  const engine = window.MotionStudioMotion;
  if (!engine || !scene) return;
  for (const [role, id] of [['title', 'glitchWrap'], ['caption', 'kicker'], ['subtitle', 'subBar']]) {
    const element = sceneElement(scene, role);
    if (!element || !element.motion || element.motion.preset === 'none') continue;
    const node = document.getElementById(id);
    const state = engine.evaluate(element.motion, localT);
    // Finished presets must not alter the template's legacy compositing.
    if (state.opacity === 1 && state.offsetX === 0 && state.offsetY === 0 && state.scale === 1) continue;
    const baseline = node.style.transform === 'none' ? '' : node.style.transform;
    const alpha = Number.parseFloat(node.style.opacity || '1');
    node.style.opacity = String((Number.isFinite(alpha) ? alpha : 1) * state.opacity);
    node.style.transform = baseline + ' translate(' + state.offsetX + 'px,' +
      state.offsetY + 'px) scale(' + state.scale + ')';
  }
}

function drawFrame(time) {
  const active = entryAt(time);
  const localT = active ? active.localT : time;
  if (active) syncSceneText(active.scene);
  const state = active ? transitionState(active.scene, localT) : { alpha: 1, x: 0 };

  drawFuturisticCity(localT);
  updateDOM(localT, state);
  if (active) applyKineticMotion(active.scene, localT);
}

window.renderFrame = function(t) {
  window.__MANUAL_RENDER__ = true;
  drawFrame(t);
};

// Auto-play jika dibuka langsung di browser
drawFrame(0);
let startTs = performance.now();
function loop(now) {
  if (!window.__MANUAL_RENDER__) {
    const t = ((now - startTs) / 1000) % TOTAL_DURATION;
    drawFrame(t);
    requestAnimationFrame(loop);
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
