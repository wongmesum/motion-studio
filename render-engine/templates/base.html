<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Motion Studio — Base Template (GSAP + Canvas 1080p)</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0a0a14;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    color: #ffffff;
  }
  canvas {
    position: absolute;
    inset: 0;
    display: block;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .badge {
    padding: 10px 28px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.14);
    border: 1px solid rgba(56, 189, 248, 0.45);
    color: #38bdf8;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .title {
    font-size: 118px;
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #ffffff 0%, #93c5fd 50%, #c084fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    line-height: 1.08;
  }
  .subtitle {
    margin-top: 24px;
    font-size: 36px;
    color: #94a3b8;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="overlay">
  <div class="badge" id="badge">RENDER PIPELINE 1080P 60FPS</div>
  <h1 class="title" id="title">MOTION STUDIO</h1>
  <p class="subtitle" id="subtitle">Playwright • GSAP • Canvas 2D • Sharp • FFmpeg</p>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 1920, H = 1080;

// ---- Motion Studio project data. Absent for legacy /render payloads, so every value
// below falls back to the hardcoded demo content this template shipped with. ----
const PROJECT = (function () {
  const node = document.getElementById('motion-project-data');
  if (!node) return null;
  try { return JSON.parse(node.textContent); } catch (error) { return null; }
})();
function projectScenes() {
  return PROJECT && Array.isArray(PROJECT.scenes) ? PROJECT.scenes : [];
}
function sceneText(scene, role, fallback) {
  if (!scene || !Array.isArray(scene.elements)) return fallback;
  const match = scene.elements.find(function (element) {
    return element.type === 'text' && element.role === role;
  });
  return match && typeof match.text === 'string' ? match.text : fallback;
}
function sceneElement(scene, role) {
  if (!scene || !Array.isArray(scene.elements)) return null;
  return scene.elements.find(function (element) {
    return element.type === 'text' && element.role === role;
  }) || null;
}

// The scene timeline owns the video length. Offsets are cumulative `durationSec` values;
// nothing here reads a wall clock, so every frame is a pure function of `time`.
const TIMELINE = (function () {
  const scenes = projectScenes();
  if (!scenes.length) return null;
  let offset = 0;
  return scenes.map(function (scene) {
    const durationSec = Number(scene.durationSec) > 0 ? Number(scene.durationSec) : 4;
    const entry = { scene: scene, start: offset, durationSec: durationSec };
    offset += durationSec;
    return entry;
  });
})();
const TOTAL_DURATION = TIMELINE
  ? TIMELINE.reduce(function (total, entry) { return total + entry.durationSec; }, 0)
  : 10;

function sceneAt(time) {
  if (!TIMELINE) return null;
  const clamped = Math.max(0, Math.min(TOTAL_DURATION - 0.0001, time));
  for (let i = 0; i < TIMELINE.length; i++) {
    const entry = TIMELINE[i];
    // The last scene owns the final instant instead of falling through to undefined.
    if (clamped < entry.start + entry.durationSec || i === TIMELINE.length - 1) {
      return {
        scene: entry.scene,
        index: i,
        localT: Math.max(0, clamped - entry.start),
        durationSec: entry.durationSec,
      };
    }
  }
  return null;
}

function transitionState(scene, localT) {
  const transition = scene.transition || {};
  const type = transition.type || 'fade';
  const windowSec = Math.min(
    Number(transition.durationSec) > 0 ? Number(transition.durationSec) : 0.5,
    (Number(scene.durationSec) > 0 ? Number(scene.durationSec) : 4) / 2
  );
  const p = windowSec > 0 ? Math.min(1, localT / windowSec) : 1;
  if (type === 'none') return { alpha: 1, x: 0 };
  if (type === 'slide') return { alpha: p, x: (1 - p) * 180 };
  return { alpha: p, x: 0 };
}

function applyTextProperties(node, element, fallback) {
  node.textContent = element && typeof element.text === 'string' ? element.text : fallback;
  if (!element) return;
  if (Number.isFinite(element.fontSize)) node.style.fontSize = element.fontSize + 'px';
  if (typeof element.color === 'string' && element.color) {
    node.style.color = element.color;
    node.style.webkitTextFillColor = element.color;
    node.style.backgroundImage = 'none';
  }
  if (typeof element.align === 'string') node.style.textAlign = element.align;
}

window.__ASSETS_READY__ = Promise.resolve();
window.__AWAIT_FRAME__ = function () { return null; };

// Easing Helpers
const easeOutExpo = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function applyMotion(node, element, localT) {
  const motion = element && element.motion;
  if (!motion) return;
  const state = window.MotionStudioMotion
    ? window.MotionStudioMotion.evaluate(motion, localT)
    : { opacity: 1, offsetX: 0, offsetY: 0, scale: 1 };
  node.style.opacity = String(state.opacity);
  node.style.transform = 'translate(' + state.offsetX + 'px, ' + state.offsetY +
    'px) scale(' + state.scale + ')';
}
function syncSceneMotion(scene, localT) {
  for (const role of ['caption', 'title', 'subtitle']) {
    const id = role === 'caption' ? 'badge' : role;
    applyMotion(document.getElementById(id), sceneElement(scene, role), localT);
  }
}
function syncSceneText(scene) {
  applyTextProperties(document.getElementById('badge'), sceneElement(scene, 'caption'), 'RENDER PIPELINE 1080P 60FPS');
  applyTextProperties(document.getElementById('title'), sceneElement(scene, 'title'), 'MOTION STUDIO');
  applyTextProperties(document.getElementById('subtitle'), sceneElement(scene, 'subtitle'), 'Playwright • GSAP • Canvas 2D • Sharp • FFmpeg');
}
syncSceneText(projectScenes()[0]);

// GSAP Deterministic Timeline (Paused)
let tl = null;
if (window.gsap) {
  tl = gsap.timeline({ paused: true });
  tl.fromTo('#badge', { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: 'power3.out' }, 0.1)
    .fromTo('#title', { y: 90, opacity: 0, scale: 0.92 }, { y: 0, opacity: 1, scale: 1, duration: 1.1, ease: 'expo.out' }, 0.25)
    .fromTo('#subtitle', { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: 'power2.out' }, 0.55)
    .to('#title', { scale: 1.04, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.5);
}

// Fungsi Deterministik Utama — Dipanggil oleh Playwright per frame
window.renderFrame = function(time) {
  window.__MANUAL_RENDER__ = true;
  drawFrame(time);
};

function drawFrame(time) {
  const active = sceneAt(time);
  const localT = active ? active.localT : time;
  const overlay = document.querySelector('.overlay');

  if (active) {
    syncSceneText(active.scene);
    const state = transitionState(active.scene, localT);
    overlay.style.opacity = String(state.alpha);
    overlay.style.transform = 'translateX(' + state.x + 'px)';
  } else {
    overlay.style.opacity = '1';
    overlay.style.transform = 'none';
  }

  if (tl) {
    // Legacy demo keeps its ten second loop; project scenes seek by their own local time.
    tl.seek(active ? localT : time % TOTAL_DURATION);
  } else {
    // Fallback jika CDN GSAP offline
    const p = easeOutExpo(Math.min(1, localT / 1.0));
    document.getElementById('title').style.opacity = String(p);
    document.getElementById('title').style.transform = `translateY(${(1 - p) * 60}px)`;
  }

  // Motion presets override the legacy timeline only for elements that opt in.
  if (active) {
    const roles = ['caption', 'title', 'subtitle'];
    for (const role of roles) {
      const element = sceneElement(active.scene, role);
      if (element && element.motion) {
        const node = document.getElementById(role === 'caption' ? 'badge' : role);
        applyMotion(node, element, localT);
      }
    }
  }

  // Background Gradient
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#070712');
  g.addColorStop(0.5, '#11102e');
  g.addColorStop(1, '#1e113a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Subtle Grid
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.05)';
  ctx.lineWidth = 1;
  const gridOffset = (time * 30) % 80;
  for (let x = 0; x < W; x += 80) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = gridOffset; y < H; y += 80) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Animated Glowing Orbs (Deterministik terhadap time)
  for (let i = 0; i < 6; i++) {
    const phase = time * 0.75 + i * 1.05;
    const x = W / 2 + Math.cos(phase) * (460 + i * 40);
    const y = H / 2 + Math.sin(phase * 1.3) * (260 + i * 20);
    const r = 180 + Math.sin(phase * 2) * 55;

    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    const hue = (i * 55 + time * 28) % 360;
    grad.addColorStop(0, `hsla(${hue}, 85%, 62%, 0.42)`);
    grad.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Progress bar tipis di bagian bawah, mengikuti total durasi timeline
  const progress = TOTAL_DURATION > 0 ? Math.min(1, time / TOTAL_DURATION) : 0;
  ctx.fillStyle = 'rgba(56, 189, 248, 0.75)';
  ctx.fillRect(0, H - 6, W * easeInOutCubic(progress), 6);
}

// Auto-preview jika dibuka langsung di browser oleh user
drawFrame(0);
let startTs = performance.now();
function loop(now) {
  if (!window.__MANUAL_RENDER__) {
    drawFrame((now - startTs) / 1000);
    requestAnimationFrame(loop);
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
